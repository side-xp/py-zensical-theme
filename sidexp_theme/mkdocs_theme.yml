# Default configuration for the "side-xp" theme.
#
# Zensical merges these values into a consumer's project, so anything set here
# becomes the default for every site that uses `theme.name = "side-xp"`.
# Consumers can still override any of it in their own zensical.toml.

# Build on top of Zensical's default theme (the Material look). This gives us
# the full base theme and lets us override only what we need to brand it.
extends: material

# Brand logo and favicon, shipped with the theme. These paths point at assets
# bundled in this package (under assets/images/); both are resolved to a
# site-root URL at build time, so they work without the consumer placing any
# file in their own docs/. A consumer can override either by setting their own
# `logo` / `favicon` (relative to their docs_dir) in their zensical.toml.
logo: assets/images/logo.png
favicon: assets/images/favicon.ico

# Brand typography. These two families are loaded by Zensical's font mechanism
# and wired to `--md-text-font` (body) and `--md-code-font` (code). The display
# font for headings (Chinese Rocks) is self-hosted via @font-face in sidexp.css,
# since it isn't available from a font provider.
font:
  text: Lexend
  code: IBM Plex Mono

# Ship a 3-state palette by default (system preference, light, dark), matching
# Zensical's own starter config. The toggle button cycles through the entries
# in order. Every entry opts into "custom" colors so the brand stylesheet
# (sidexp.css) drives primary/accent. This includes the system entry: it is the
# first one, so Zensical uses it for a first visit, and otherwise its colors
# would fall back to the upstream default. A consumer that defines its own
# "palette" replaces this entirely.
palette:
  # Follows the OS setting: Zensical's script picks the light or dark entry
  # below by matching their "media" queries.
  - media: "(prefers-color-scheme)"
    primary: custom
    accent: custom
    toggle:
      icon: lucide/sun-moon
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: lucide/sun
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: lucide/moon
      name: Switch to system preference
